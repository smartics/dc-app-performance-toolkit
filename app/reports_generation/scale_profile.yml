# Defines which column from test runs is used for aggregated report. Default is "90% Line"
column_name: "90% Line"
runs:
  # relativePath should contain a relative path to the directory with run results starting from dc-app-performance-toolkit folder.
  # E.g. relativePath: "./app/results/jira/2024-01-01_10-10-10"
  - runName: "1 Node"
    runType: "baseline"
    relativePath: "./app/results/confluence/RUN3_US"
  - runName: "2 Nodes"
    runType: "experiment"
    relativePath: "./app/results/confluence/RUN4_US"
  - runName: "4 Nodes"
    runType: "experiment"
    relativePath: "./app/results/confluence/RUN5_US"

# Chart generation configs
index_col: "Action"
title: "DCAPT Userscripts Scale Testing"
image_height_px: 1000
image_width_px: 1600
