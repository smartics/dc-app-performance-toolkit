# Defines which column from test runs is used for aggregated report. Default is "90% Line"
column_name: "90% Line"
runs:
  # relativePath should contain a relative path to the directory with run results starting from dc-app-performance-toolkit folder.
  # E.g. relativePath: "./app/results/jira/2024-01-01_10-10-10"
  - runName: "without app"
    runType: "baseline"
    relativePath: "./app/results/confluence/RUN1_DM"
  - runName: "with app (Documentation Macros)"
    runType: "experiment"
    relativePath: "./app/results/confluence/RUN2_DM"

# Chart generation config
index_col: "Action"
title: "Documentation Macros - Performance Regression Testing (RUN1 vs RUN2)"
image_height_px: 1000
image_width_px: 1600
check_actions_count: false
